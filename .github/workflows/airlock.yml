# Airlock promotion pipeline.
#
# Design rules this file follows (see SECURITY-CONTROLS.md for the full list):
#   - Third-party actions pinned to full commit SHAs, tag noted in a comment.
#   - Default token permissions: contents:read. Jobs elevate individually.
#   - Nothing privileged runs on pull_request (fork PRs get verify only).
#   - Signing identity comes from the workflow's OIDC token (keyless), never
#     from a stored key. Deploy identity is Azure federated credentials (OIDC),
#     never a stored cloud secret.
#   - The deploy job is a TEMPLATE: it activates only after the Azure side of
#     SECURITY-CONTROLS.md is configured (federated credential bound to this
#     repo + environment). Until then it is skipped.

name: airlock

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dev tools
        run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
      - name: Static analysis (bandit)
        run: python -m bandit -r app scripts -q
      - name: Dependency audit (pip-audit)
        run: python -m pip_audit -r requirements-dev.txt
      - name: Secret scan (gitleaks, checksum-pinned binary)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tgz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --no-banner --redact

  build-sign-gate:
    # Push events only: fork PRs must never reach signing.
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for keyless signing; scoped to this job only
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dev tools
        run: python -m pip install -r requirements-dev.txt
      - name: Build release candidate (artifact + provenance + manifest)
        run: python scripts/build_release.py --commit "${GITHUB_SHA}" --builder "github-actions:${GITHUB_WORKFLOW_REF}" --evidence ci/evidence-ci.json
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: dist/airlock-app.zip
          format: cyclonedx-json
          output-file: dist/sbom.cdx.json
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Keyless sign artifact + provenance (sigstore)
        run: |
          cosign sign-blob --yes dist/airlock-app.zip \
            --bundle dist/airlock-app.zip.sigstore.json
          cosign sign-blob --yes dist/provenance.json \
            --bundle dist/provenance.json.sigstore.json
      - name: Verify signatures bind to THIS workflow identity
        run: |
          cosign verify-blob dist/airlock-app.zip \
            --bundle dist/airlock-app.zip.sigstore.json \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          cosign verify-blob dist/provenance.json \
            --bundle dist/provenance.json.sigstore.json \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Release gate (fail closed)
        run: python -m app.release_gate dist/manifest.json
      - name: Upload release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate
          path: dist/
          if-no-files-found: error

  deploy:
    # TEMPLATE. Requires, per SECURITY-CONTROLS.md: the 'production' environment
    # with required reviewers, and an Azure federated credential restricted to
    # repo+environment claims. The vars guard makes this job skip cleanly until
    # that configuration exists, instead of failing on a half-configured tenant.
    if: startsWith(github.ref, 'refs/tags/v') && vars.AZURE_CLIENT_ID != ''
    needs: build-sign-gate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC for azure/login federated credential; no stored secrets
    steps:
      - name: Azure login (OIDC, no stored cloud secrets)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to Azure Functions
        uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: dist/airlock-app.zip
